<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Template</title>
    <!-- Load Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Custom Styles for Centering and Aesthetics -->
    <style>
        /* Use Inter font for modern look */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa; /* Very light background */
            min-height: 100vh;
            display: flex;
            align-items: center; /* Vertical centering */
            justify-content: center; /* Horizontal centering */
            padding: 1.5rem; /* Padding for mobile view */
        }

        .login-container {
            max-width: 420px;
            width: 100%;
        }

        .login-card {
            border: none;
            border-radius: 1.25rem; /* More rounded corners */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* Soft shadow */
            padding: 2rem;
        }

        .input-group-text {
            background-color: #e9ecef;
            border-right: none;
            border-radius: 0.75rem 0 0 0.75rem;
        }

        .form-control {
            border-left: none;
            border-radius: 0 0.75rem 0.75rem 0;
            padding: 0.75rem 1rem;
        }

        .btn-primary {
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="card login-card">
            <div class="card-body">
                <h2 class="card-title text-center mb-4 fw-bold text-primary">Sign In</h2>
                <p class="text-center text-muted mb-4">Access your dashboard with your credentials.</p>

                <!-- Login Form -->
                <form action="dashboard.html" method="POST" onsubmit="return handleLogin(event)">
                    
                    <!-- Email Input with Icon -->
                    <div class="mb-3">
                        <label for="emailInput" class="form-label visually-hidden">Email address</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <!-- Email Icon (SVG from Bootstrap Icons) -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-envelope" viewBox="0 0 16 16">
                                    <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.5v7a1 1 0 0 0 1 1V5.5zM2 5.5V11a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V5.5L8 9.5z"/>
                                </svg>
                            </span>
                            <input type="email" class="form-control" id="emailInput" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <!-- Password Input with Icon -->
                    <div class="mb-4">
                        <label for="passwordInput" class="form-label visually-hidden">Password</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <!-- Lock Icon (SVG from Bootstrap Icons) -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock-fill" viewBox="0 0 16 16">
                                    <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m-2 7h4v4h-4z"/>
                                    <path d="M12 9H4v-1h8v1zm0-3a4 4 0 0 0-8 0v1h8V6zm-8 4h8v4H4z"/>
                                </svg>
                            </span>
                            <input type="password" class="form-control" id="passwordInput" placeholder="Enter password" required>
                        </div>
                    </div>

                    <!-- Login Button -->
                    <div class="d-grid gap-2 mb-4">
                        <button  type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>

                <!-- Create Account Link -->
                <div class="text-center">
                    <p class="mb-0 text-muted">Don't have an account?</p>
                    <a href="register.html" class="text-decoration-none fw-bold text-primary">Create account now</a>
                </div>
                <div class="text-center mt-3">
                    <a href="index.html" class="text-decoration-none text-muted">Back to home</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        function handleLogin(event) {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const storedEmail = localStorage.getItem('userEmail');
            const storedPassword = localStorage.getItem('userPassword');
            
            if (!email || !password) {
                alert('Please fill in all fields');
                event.preventDefault();
                return false;
            }
            
            if (email === storedEmail && password === storedPassword) {
                return true;
            }
            
            alert('Invalid email or password. Please register first or check your credentials.');
            event.preventDefault();
            return false;
        }
    </script>
</body>
</html>
