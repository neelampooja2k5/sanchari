<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - Create Account</title>
    <!-- Load Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Custom Styles for Centering and Aesthetics -->
    <style>
        /* Use Inter font for modern look */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa; /* Very light background */
            min-height: 100vh;
            display: flex;
            align-items: center; /* Vertical centering */
            justify-content: center; /* Horizontal centering */
            padding: 1.5rem; /* Padding for mobile view */
        }

        .signup-container {
            max-width: 450px;
            width: 100%;
        }

        .signup-card {
            border: none;
            border-radius: 1.25rem; /* More rounded corners */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); /* Soft shadow */
            padding: 2.5rem 2rem;
        }

        .form-control {
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
        }

        .btn-success {
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-weight: bold;
            background-color: #198754; /* Default Bootstrap success color */
            border-color: #198754;
            transition: background-color 0.3s ease;
        }

        .btn-success:hover {
            background-color: #157347;
            border-color: #157347;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="card signup-card">
            <div class="card-body">
                <h2 class="card-title text-center mb-4 fw-bold text-success">Create Your Account</h2>
                <p class="text-center text-muted mb-5">Join us today for full access to our services.</p>

                <!-- Signup Form -->
                <form action="login.html" method="POST" onsubmit="return handleRegister(event)">

                    <!-- Full Name Input -->
                    <div class="mb-3">
                        <label for="fullNameInput" class="form-label fw-medium">Full Name</label>
                        <input type="text" class="form-control" id="fullNameInput" placeholder="Enter your full name" required>
                    </div>

                    <!-- Email Input -->
                    <div class="mb-3">
                        <label for="emailInput" class="form-label fw-medium">Email address</label>
                        <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
                    </div>

                    <!-- Password Input -->
                    <div class="mb-3">
                        <label for="passwordInput" class="form-label fw-medium">Password</label>
                        <input type="password" class="form-control" id="passwordInput" placeholder="Must be at least 8 characters" required>
                    </div>

                    <!-- Confirm Password Input -->
                    <div class="mb-4">
                        <label for="confirmPasswordInput" class="form-label fw-medium">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Re-enter your password" required>
                    </div>

                    <!-- Register Button -->
                    <div class="d-grid gap-2 mb-4">
                        <button type="submit" class="btn btn-success">Register</button>
                    </div>
                </form>

                <!-- Link to Login Page -->
                <div class="text-center">
                    <p class="mb-0 text-muted">Already have an account?</p>
                    <a href="login.html" class="text-decoration-none fw-bold text-success">Log in here</a>
                </div>
                <div class="text-center mt-3">
                    <a href="index.html" class="text-decoration-none text-muted">Back to home</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Note: Bootstrap JS is included for general completeness, though no interactive JS is used here. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        function handleRegister(event) {
            const fullName = document.getElementById('fullNameInput').value;
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;
            
            if (!fullName || !email || !password || !confirmPassword) {
                alert('Please fill in all fields');
                event.preventDefault();
                return false;
            }
            
            if (password !== confirmPassword) {
                alert('Passwords do not match');
                event.preventDefault();
                return false;
            }
            
            if (password.length < 8) {
                alert('Password must be at least 8 characters');
                event.preventDefault();
                return false;
            }
            
            // Store user data
            localStorage.setItem('userName', fullName);
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userPassword', password);
            
            return true;
        }
    </script>
</body>
</html>
