<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget Manager</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .dashboard-card {
      background: #fff;
      border-radius: .5rem;
      box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,.1);
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    .chart-placeholder {
      height: 300px;
      background: #e9ecef;
      border-radius: .5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6c757d;
      font-size: 1.2rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="dashboard.html"><i class="bi bi-wallet2 me-2"></i>Budget Manager</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="tripplanner.html">Trip Planner</a></li>
          <li class="nav-item"><a class="nav-link" href="discover.html">Discover</a></li>
          <li class="nav-item"><a class="nav-link" href="translation.html">Translate</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row">
      <!-- Expense Input Form -->
      <div class="col-lg-4">
        <div class="dashboard-card">
          <h5 class="mb-3"><i class="bi bi-plus-circle me-2"></i>Add Expense</h5>
          <form>
            <div class="mb-3">
              <label for="amount" class="form-label">Amount</label>
              <input type="number" class="form-control" id="amount" placeholder="Enter amount">
            </div>
            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <select class="form-select" id="category">
                <option selected>Select category...</option>
                <option>Food</option>
                <option>Transport</option>
                <option>Entertainment</option>
                <option>Utilities</option>
                <option>Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="note" class="form-label">Note</label>
              <input type="text" class="form-control" id="note" placeholder="Optional note">
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-check-circle me-2"></i>Save Expense
            </button>
          </form>
        </div>
      </div>

      <!-- Expenses Table & Charts -->
      <div class="col-lg-8">
        <!-- Expenses Table -->
        <div class="dashboard-card">
          <h5 class="mb-3"><i class="bi bi-list-ul me-2"></i>Expenses List</h5>
          <div class="table-responsive">
            <table class="table table-striped align-middle">
              <thead class="table-light">
                <tr>
                  <th scope="col">Date</th>
                  <th scope="col">Amount</th>
                  <th scope="col">Category</th>
                  <th scope="col">Note</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>2025-12-06</td>
                  <td>$50</td>
                  <td>Food</td>
                  <td>Lunch with friends</td>
                </tr>
                <tr>
                  <td>2025-12-05</td>
                  <td>$20</td>
                  <td>Transport</td>
                  <td>Taxi fare</td>
                </tr>
                <tr>
                  <td>2025-12-04</td>
                  <td>$100</td>
                  <td>Utilities</td>
                  <td>Electricity bill</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Charts Placeholder -->
        <div class="dashboard-card">
          <h5 class="mb-3"><i class="bi bi-bar-chart-line me-2"></i>Expense Charts</h5>
          <div class="chart-placeholder">
            Chart will be displayed here
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
