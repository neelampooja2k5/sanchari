<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login - Sanchari</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .oauth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .oauth-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); max-width: 500px; width: 100%; }
        .oauth-header { text-align: center; margin-bottom: 30px; }
        .oauth-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #ea4335 0%, #fbbc04 100%); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: white; margin: 0 auto 15px; }
        .oauth-header h1 { font-size: 28px; color: #2d3436; margin-bottom: 5px; }
        .oauth-header p { color: #636e72; font-size: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .form-group label { color: #2d3436; font-weight: 600; font-size: 14px; }
        .form-group input { padding: 12px 15px; border: 2px solid #dfe6e9; border-radius: 8px; font-size: 14px; transition: all 0.3s ease; }
        .form-group input:focus { outline: none; border-color: #ea4335; box-shadow: 0 0 0 3px rgba(234, 67, 53, 0.1); }
        .error-message { color: #ff6b6b; font-size: 12px; margin-top: 4px; }
        .form-group input.error { border-color: #ff6b6b; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; width: 100%; }
        .btn-primary { background: #ea4335; color: white; }
        .btn-primary:hover { background: #d33425; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(234, 67, 53, 0.3); }
        .btn-back { background: #f0f4ff; color: #667eea; margin-top: 15px; }
        .btn-back:hover { background: #e6ecff; }
        .info-text { background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-size: 13px; color: #856404; }
        .divider { text-align: center; margin: 25px 0; color: #636e72; }
    </style>
</head>
<body>
    <div class="oauth-container">
        <div class="oauth-card">
            <div class="oauth-header">
                <div class="oauth-icon">
                    <i class="fab fa-google"></i>
                </div>
                <h1>Google Login</h1>
                <p>Continue to Sanchari with your Google Account</p>
            </div>

            <div class="info-text">
                <i class="fas fa-info-circle"></i> Enter your Google account details to sign in
            </div>

            <form id="googleLoginForm">
                <div class="form-group">
                    <label for="googleEmail">Google Email Address</label>
                    <input type="email" id="googleEmail" name="email" placeholder="your.email@gmail.com" required>
                    <span class="error-message" id="googleEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="googlePassword">Google Account Password</label>
                    <input type="password" id="googlePassword" name="password" placeholder="Enter your password" required>
                    <span class="error-message" id="googlePasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="googleName">Full Name</label>
                    <input type="text" id="googleName" name="name" placeholder="Your full name" required>
                    <span class="error-message" id="googleNameError"></span>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login with Google
                </button>
                <button type="button" class="btn btn-back" onclick="window.location.href='login.html'">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </button>
            </form>

            <div class="divider">
                <small>Your data is secure and encrypted</small>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('googleLoginForm');
        const emailInput = document.getElementById('googleEmail');
        const passwordInput = document.getElementById('googlePassword');
        const nameInput = document.getElementById('googleName');

        function clearError(input) {
            const errorEl = document.getElementById(input.id + 'Error');
            if (errorEl) errorEl.textContent = '';
            input.classList.remove('error');
        }

        function showError(input, message) {
            const errorEl = document.getElementById(input.id + 'Error');
            if (errorEl) errorEl.textContent = message;
            input.classList.add('error');
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            clearError(emailInput);
            clearError(passwordInput);
            clearError(nameInput);

            let isValid = true;

            if (!emailInput.value) {
                showError(emailInput, 'Email is required');
                isValid = false;
            } else if (!emailInput.value.includes('@gmail.com') && !emailInput.value.includes('@google.com')) {
                showError(emailInput, 'Please use a valid Google account email');
                isValid = false;
            }

            if (!passwordInput.value) {
                showError(passwordInput, 'Password is required');
                isValid = false;
            } else if (passwordInput.value.length < 6) {
                showError(passwordInput, 'Invalid password');
                isValid = false;
            }

            if (!nameInput.value) {
                showError(nameInput, 'Name is required');
                isValid = false;
            }

            if (isValid) {
                // Store Google login info
                localStorage.setItem('user', JSON.stringify({
                    name: nameInput.value,
                    email: emailInput.value,
                    provider: 'google'
                }));
                localStorage.setItem('token', 'google-oauth-token-' + Date.now());
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
